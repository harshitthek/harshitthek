name: Refresh contribution signal

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-contribution-signal
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Check out the default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test signal generator
        run: node --test .github/scripts/generate-contribution-signal.test.mjs

      - name: Generate public contribution signal
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USERNAME: harshitthek
        run: node .github/scripts/generate-contribution-signal.mjs

      - name: Commit an updated signal
        shell: bash
        run: |
          git add assets/activity/contribution-signal.svg
          if git diff --cached --quiet; then
            echo "Contribution signal is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh contribution signal"
          git push
