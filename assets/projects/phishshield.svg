<svg width="560" height="240" viewBox="0 0 560 240" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">PhishShield AI</title><desc id="desc">Project card for an explainable machine-learning phishing detection workbench.</desc>
  <defs>
    <linearGradient id="shield" x1="381" y1="56" x2="505" y2="176" gradientUnits="userSpaceOnUse"><stop stop-color="#60A5FA"/><stop offset=".52" stop-color="#5EEAD4"/><stop offset="1" stop-color="#FB7185"/></linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>.mono{font-family:"Fira Code",Consolas,monospace}.sans{font-family:Inter,ui-sans-serif,system-ui,sans-serif}.beam{animation:scan 3.2s ease-in-out infinite}.alert{animation:blink 1.7s ease-in-out infinite}@keyframes scan{0%,100%{transform:translateY(-34px);opacity:.2}50%{transform:translateY(41px);opacity:1}}@keyframes blink{0%,100%{opacity:.35}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.beam,.alert{animation:none}}</style>
  </defs>
  <rect x="1" y="1" width="558" height="238" rx="10" fill="#0B0F15" stroke="#303B49" stroke-width="2"/>
  <path d="M24 205H536" stroke="url(#shield)" stroke-width="2"/>
  <text x="28" y="43" class="mono" fill="#60A5FA" font-size="11">SECURITY ML / 05</text>
  <text x="28" y="80" class="sans" fill="#F8FAFC" font-size="29" font-weight="800">PhishShield AI</text>
  <text x="28" y="108" class="mono" fill="#B8C3CF" font-size="13">Explainable phishing threat workbench.</text>
  <text x="28" y="131" class="mono" fill="#818E9C" font-size="12">TF-IDF • URL heuristics • risk reasons</text>
  <g>
    <path d="M444 44L504 68V113C504 151 479 174 444 187C409 174 384 151 384 113V68L444 44Z" fill="#111923" stroke="url(#shield)" stroke-width="3"/>
    <path d="M417 113L436 132L475 91" stroke="#5EEAD4" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <path d="M392 87H496" stroke="#FB7185" stroke-width="3" opacity=".82" class="beam"/>
    <circle cx="495" cy="66" r="7" fill="#FB7185" class="alert"/>
  </g>
  <g class="mono" font-size="11" font-weight="700">
    <rect x="28" y="158" width="62" height="25" rx="4" fill="#151F2C"/><text x="40" y="175" fill="#9CC5FF">Python</text>
    <rect x="98" y="158" width="69" height="25" rx="4" fill="#13231F"/><text x="109" y="175" fill="#91EEDC">FastAPI</text>
    <rect x="175" y="158" width="64" height="25" rx="4" fill="#201318"/><text x="187" y="175" fill="#FDA1B8">TF-IDF</text>
    <rect x="247" y="158" width="68" height="25" rx="4" fill="#121D2A"/><text x="258" y="175" fill="#9CC5FF">sklearn</text>
  </g>
  <text x="28" y="224" class="mono" fill="#667481" font-size="10">TEXT SIGNAL + URL SIGNAL → EXPLAINED VERDICT</text>
</svg>
