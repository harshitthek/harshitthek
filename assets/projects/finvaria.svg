  <text x="28" y="108" class="mono" fill="#C5BBCD" font-size="13">Offline-first guidance for Indian youth.</text>
  <text x="28" y="131" class="mono" fill="#8E8298" font-size="12">on-device LLM • 11 languages • Android</text>
