<svg width="560" height="240" viewBox="0 0 560 240" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Finvaria</title><desc id="desc">Project card for an offline-first Android youth guidance app with an on-device language model.</desc>
  <defs>
