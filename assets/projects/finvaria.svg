    <style>.mono{font-family:"Fira Code",Consolas,monospace}.sans{font-family:Inter,ui-sans-serif,system-ui,sans-serif}.ring{animation:ring 3.4s ease-out infinite;transform-box:fill-box;transform-origin:center}.r2{animation-delay:1.15s}.r3{animation-delay:2.3s}.packet{animation:rise 3s ease-in-out infinite}@keyframes ring{0%{opacity:.8;transform:scale(.55)}75%,100%{opacity:0;transform:scale(1.25)}}@keyframes rise{0%,100%{transform:translateY(10px);opacity:.45}50%{transform:translateY(-12px);opacity:1}}@media(prefers-reduced-motion:reduce){.ring,.packet{animation:none}}</style>
  </defs>
