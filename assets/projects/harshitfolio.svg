    <circle cx="444" cy="112" r="27" stroke="#5EEAD4"/><ellipse cx="444" cy="112" rx="50" ry="16" stroke="#FBBF24" class="orbit"/><ellipse cx="444" cy="112" rx="16" ry="50" stroke="#FB7185" class="orbit"/>
    <circle cx="444" cy="112" r="7" fill="#F8FAFC"/>
    <g class="bars" fill="#5EEAD4"><rect x="382" y="145" width="7" height="22"/><rect x="394" y="136" width="7" height="31"/><rect x="406" y="151" width="7" height="16"/></g>
