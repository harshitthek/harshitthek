<svg width="560" height="240" viewBox="0 0 560 240" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Harshitfolio</title><desc id="desc">Project card for a React and Canvas engineering command-center portfolio.</desc>
  <defs>
    <linearGradient id="hud" x1="370" y1="47" x2="520" y2="184" gradientUnits="userSpaceOnUse"><stop stop-color="#FB7185"/><stop offset=".5" stop-color="#FBBF24"/><stop offset="1" stop-color="#5EEAD4"/></linearGradient>
    <style>.mono{font-family:"Fira Code",Consolas,monospace}.sans{font-family:Inter,ui-sans-serif,system-ui,sans-serif}.orbit{animation:orbit 8s linear infinite;transform-origin:444px 111px}.type{animation:type 1s steps(2,end) infinite}.bars rect{animation:bars 2.7s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}.bars rect:nth-child(2){animation-delay:.5s}.bars rect:nth-child(3){animation-delay:1s}@keyframes orbit{to{transform:rotate(360deg)}}@keyframes type{0%,45%{opacity:1}46%,100%{opacity:0}}@keyframes bars{0%,100%{transform:scaleY(.55)}50%{transform:scaleY(1)}}@media(prefers-reduced-motion:reduce){.orbit,.type,.bars rect{animation:none}}</style>
  </defs>
  <rect x="1" y="1" width="558" height="238" rx="10" fill="#120D0F" stroke="#443238" stroke-width="2"/>
  <path d="M24 205H536" stroke="url(#hud)" stroke-width="2"/>
  <text x="28" y="43" class="mono" fill="#FB7185" font-size="11">INTERACTIVE FRONTEND / 06</text>
  <text x="28" y="80" class="sans" fill="#F8FAFC" font-size="29" font-weight="800">Harshitfolio</text>
  <text x="28" y="108" class="mono" fill="#CABBC0" font-size="13">Engineering command center in the browser.</text>
  <text x="28" y="131" class="mono" fill="#938187" font-size="12">Canvas 2D • telemetry • procedural audio</text>
