<svg width="560" height="240" viewBox="0 0 560 240" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Yggdrasil</title><desc id="desc">Project card for a modular self-hosted Discord platform and encrypted API.</desc>
  <defs>
    <linearGradient id="tree" x1="365" y1="53" x2="505" y2="174" gradientUnits="userSpaceOnUse"><stop stop-color="#A3E635"/><stop offset=".56" stop-color="#5EEAD4"/><stop offset="1" stop-color="#60A5FA"/></linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>.mono{font-family:"Fira Code",Consolas,monospace}.sans{font-family:Inter,ui-sans-serif,system-ui,sans-serif}.branch{stroke-dasharray:6 8;animation:grow 5s linear infinite}.node{animation:pulse 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.d1{animation-delay:.8s}.d2{animation-delay:1.6s}@keyframes grow{to{stroke-dashoffset:-28}}@keyframes pulse{0%,100%{opacity:.5;transform:scale(.88)}50%{opacity:1;transform:scale(1.16)}}@media(prefers-reduced-motion:reduce){.branch,.node{animation:none}}</style>
  </defs>
  <rect x="1" y="1" width="558" height="238" rx="10" fill="#0C110D" stroke="#344033" stroke-width="2"/>
  <path d="M24 205H536" stroke="url(#tree)" stroke-width="2"/>
  <text x="28" y="43" class="mono" fill="#A3E635" font-size="11">SELF-HOSTED SYSTEMS / 02</text>
  <text x="28" y="80" class="sans" fill="#F8FAFC" font-size="29" font-weight="800">Yggdrasil</text>
  <text x="28" y="108" class="mono" fill="#B9C5B8" font-size="13">Modular Discord platform + encrypted API.</text>
  <text x="28" y="131" class="mono" fill="#849183" font-size="12">moderation • music pipeline • low overhead</text>
  <g stroke="url(#tree)" stroke-width="2" class="branch">
    <path d="M438 169V72M438 100L388 65M438 116L492 75M438 137L386 124M438 146L495 132"/>
  </g>
  <g filter="url(#glow)">
    <circle cx="438" cy="72" r="7" fill="#A3E635" class="node"/><circle cx="388" cy="65" r="6" fill="#5EEAD4" class="node d1"/><circle cx="492" cy="75" r="6" fill="#60A5FA" class="node d2"/><circle cx="386" cy="124" r="6" fill="#FBBF24" class="node d2"/><circle cx="495" cy="132" r="6" fill="#FB7185" class="node d1"/>
  </g>
  <path d="M421 169H455L448 181H428Z" fill="#263425" stroke="#A3E635"/>
  <g class="mono" font-size="11" font-weight="700">
    <rect x="28" y="158" width="65" height="25" rx="4" fill="#182218"/><text x="40" y="175" fill="#C4F17A">Node.js</text>
    <rect x="101" y="158" width="66" height="25" rx="4" fill="#13231F"/><text x="112" y="175" fill="#91EEDC">Fastify</text>
    <rect x="175" y="158" width="75" height="25" rx="4" fill="#141E27"/><text x="185" y="175" fill="#93C5FD">MongoDB</text>
    <rect x="258" y="158" width="54" height="25" rx="4" fill="#241D11"/><text x="269" y="175" fill="#FCD76C">Rust</text>
  </g>
  <text x="28" y="224" class="mono" fill="#6B776A" font-size="10">DISCORD • FASTIFY • MONGODB • NATIVE AUDIO</text>
</svg>
