<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Cyber lab banner for Harshit Sharma</title>
  <desc id="desc">A dark cyber lab scene with terminal panels, neural nodes, and purple green highlights.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#060815"/>
      <stop offset="0.46" stop-color="#0B1025"/>
      <stop offset="1" stop-color="#101827"/>
    </linearGradient>
    <linearGradient id="accent" x1="166" y1="50" x2="1068" y2="323" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="0.42" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
    <linearGradient id="panel" x1="120" y1="66" x2="1055" y2="311" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10192E" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#07101E" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.54 0 0 0 0 0.36 0 0 0 0 0.96 0 0 0 0.8 0"/>
      <feBlend in="SourceGraphic" mode="screen"/>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#26324D" stroke-width="1" opacity="0.42"/>
    </pattern>
    <style>
      .mono { font-family: "Fira Code", Consolas, "Liberation Mono", monospace; }
      .label { fill: #94A3B8; font-size: 14px; letter-spacing: 1px; }
      .tiny { fill: #64748B; font-size: 11px; letter-spacing: 1px; }
      .type { animation: pulse 2.8s ease-in-out infinite; }
      .node { animation: blink 3.2s ease-in-out infinite; }
      .node:nth-of-type(2n) { animation-delay: .7s; }
      .node:nth-of-type(3n) { animation-delay: 1.4s; }
      @keyframes pulse { 0%,100% { opacity: .75; } 50% { opacity: 1; } }
      @keyframes blink { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
    </style>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)" opacity="0.68"/>
  <path d="M0 285C132 232 205 329 342 284C490 236 567 108 721 144C840 172 902 274 1032 231C1105 207 1150 159 1200 170V360H0V285Z" fill="#111827" opacity="0.48"/>
  <path d="M50 313C197 254 241 334 384 292C545 245 596 160 728 181C866 203 898 306 1059 260C1123 242 1169 213 1200 210" stroke="url(#accent)" stroke-width="2" opacity="0.42"/>

  <rect x="78" y="54" width="1044" height="252" rx="24" fill="url(#panel)" stroke="#29354F"/>
  <rect x="102" y="80" width="424" height="198" rx="16" fill="#080E1C" stroke="#1E293B"/>
  <circle cx="126" cy="102" r="6" fill="#EF4444"/>
  <circle cx="148" cy="102" r="6" fill="#F59E0B"/>
  <circle cx="170" cy="102" r="6" fill="#22C55E"/>
  <text x="124" y="139" class="mono label">$ whoami</text>
  <text x="124" y="169" class="mono" font-size="24" font-weight="700" fill="#F8FAFC">Harshit Sharma</text>
  <text x="124" y="199" class="mono" font-size="16" fill="#A78BFA">AI/ML student + full stack builder</text>
  <text x="124" y="229" class="mono" font-size="16" fill="#67E8F9">cybersecurity learner // linux explorer</text>
  <text x="124" y="257" class="mono tiny">status: learning by breaking, building, and shipping</text>

  <g opacity="0.92">
    <path d="M716 244L840 178L1014 231L887 303L716 244Z" fill="#0B1222" stroke="#334155"/>
    <path d="M760 239L844 197L930 224L846 270L760 239Z" fill="#111827" stroke="#475569"/>
    <rect x="792" y="190" width="28" height="58" rx="3" fill="#0E7490"/>
    <rect x="792" y="166" width="28" height="24" rx="3" fill="#22D3EE"/>
    <rect x="838" y="176" width="28" height="74" rx="3" fill="#5B21B6"/>
    <rect x="838" y="140" width="28" height="36" rx="3" fill="#A78BFA"/>
    <rect x="884" y="199" width="28" height="53" rx="3" fill="#166534"/>
    <rect x="884" y="172" width="28" height="27" rx="3" fill="#22C55E"/>
    <rect x="930" y="187" width="28" height="68" rx="3" fill="#0E7490"/>
    <rect x="930" y="154" width="28" height="33" rx="3" fill="#22D3EE"/>
    <path d="M746 251C808 207 883 202 966 235" stroke="url(#accent)" stroke-width="5" stroke-linecap="round" opacity="0.95"/>
  </g>

  <g filter="url(#glow)" opacity="0.66">
    <path d="M642 104L732 78L835 112L914 85L1013 129" stroke="url(#accent)" stroke-width="3"/>
    <path d="M641 186L721 146L839 191L918 153L1015 205" stroke="url(#accent)" stroke-width="3" opacity="0.72"/>
    <path d="M642 255L738 222L838 244L929 213L1014 260" stroke="url(#accent)" stroke-width="3" opacity="0.56"/>
  </g>

  <g>
    <circle class="node" cx="642" cy="104" r="8" fill="#22D3EE"/>
    <circle class="node" cx="732" cy="78" r="7" fill="#8B5CF6"/>
    <circle class="node" cx="835" cy="112" r="9" fill="#22C55E"/>
    <circle class="node" cx="914" cy="85" r="7" fill="#22D3EE"/>
    <circle class="node" cx="1013" cy="129" r="8" fill="#A78BFA"/>
    <circle class="node" cx="641" cy="186" r="8" fill="#8B5CF6"/>
    <circle class="node" cx="721" cy="146" r="7" fill="#22C55E"/>
    <circle class="node" cx="839" cy="191" r="8" fill="#22D3EE"/>
    <circle class="node" cx="918" cy="153" r="7" fill="#A78BFA"/>
    <circle class="node" cx="1015" cy="205" r="8" fill="#22C55E"/>
    <circle class="node" cx="642" cy="255" r="7" fill="#22D3EE"/>
    <circle class="node" cx="738" cy="222" r="8" fill="#A78BFA"/>
    <circle class="node" cx="838" cy="244" r="7" fill="#22C55E"/>
    <circle class="node" cx="929" cy="213" r="8" fill="#22D3EE"/>
    <circle class="node" cx="1014" cy="260" r="7" fill="#8B5CF6"/>
  </g>

  <rect x="584" y="83" width="484" height="196" rx="18" stroke="#334155" stroke-dasharray="8 10" opacity="0.8"/>
  <text x="616" y="135" class="mono label">MODEL_PIPELINE</text>
  <text x="616" y="168" class="mono" font-size="22" font-weight="700" fill="#F8FAFC">BUILD. TEST. LEARN.</text>
  <text x="616" y="203" class="mono" font-size="15" fill="#CBD5E1">ML apps / backend APIs / secure web tools</text>
  <text x="616" y="230" class="mono" font-size="15" fill="#94A3B8">New Delhi, India</text>
  <text x="616" y="257" class="mono tiny type">01001000 01000001 01010010 01010011 01001000 01001001 01010100</text>

  <rect x="78" y="54" width="1044" height="252" rx="24" stroke="url(#accent)" stroke-width="2" opacity="0.85"/>
</svg>
